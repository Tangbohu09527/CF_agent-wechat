name: Deployment hardening

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          for file in \
            scripts/bootstrap-cfserver.sh \
            tests/helpers/mock_bootstrap_*.sh \
            tests/deployment/bootstrap_cfserver.sh \
            tests/deployment/validate_compose_config.sh \
            tests/integration/production_compose_recovery.sh
          do
            bash -n "$file"
          done
      - name: Test CFserver bootstrap and recovery gates
        run: bash tests/deployment/bootstrap_cfserver.sh
      - name: Validate production Compose render
        env:
          CF_REQUIRE_DOCKER_COMPOSE_CONFIG: "1"
        run: bash tests/deployment/validate_compose_config.sh
      - name: Run production Compose restart and recreate recovery E2E
        env:
          CF_REQUIRE_DOCKER_E2E: "1"
        run: bash tests/integration/production_compose_recovery.sh
