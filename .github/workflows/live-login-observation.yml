name: Minimal live observation and WAL candidate
on:
  push:
    paths:
      - 'upstream/live-login-observation/**'
      - 'scripts/apply-live-login-observation.py'
      - 'scripts/package-live-observation.py'
      - 'tests/test_live_login_observation_overlay.py'
      - '.github/workflows/live-login-observation.yml'
  pull_request:
    paths:
      - 'upstream/live-login-observation/**'
      - 'scripts/apply-live-login-observation.py'
      - 'scripts/package-live-observation.py'
      - 'tests/test_live_login_observation_overlay.py'
      - '.github/workflows/live-login-observation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-regression-and-release:
    name: Native RED GREEN and one-binary fixed-runtime package
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/agent-wechat/cargo-target-live
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thisnick/agent-wechat
          ref: 96c2e90c497d999bf5189a134a9b3b293731f42e
          path: agent-wechat/live-red
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: thisnick/agent-wechat
          ref: 96c2e90c497d999bf5189a134a9b3b293731f42e
          path: agent-wechat/live-green
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: thisnick/agent-wechat
          ref: 96c2e90c497d999bf5189a134a9b3b293731f42e
          path: agent-wechat/live-guarded
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Check identities and apply only reviewed overlays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/live-observation
          CF_LOGIN_SOURCE="$PWD/agent-wechat/live-green" python3 -m unittest discover -s tests -p test_live_login_observation_overlay.py -v 2>&1 | tee test-results/live-observation/python.txt
          python3 scripts/apply-live-login-observation.py --source agent-wechat/live-red --regression-only > test-results/live-observation/red-source.json
          python3 scripts/apply-live-login-observation.py --source agent-wechat/live-green > test-results/live-observation/green-source.json
          python3 scripts/apply-live-login-observation.py --source agent-wechat/live-guarded --with-expected-account > test-results/live-observation/guarded-source.json
      - name: RED actual unpatched behavior must fail named regressions
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --locked --manifest-path agent-wechat/live-red/packages/agent-server-rust/Cargo.toml live_login_ -- --nocapture > test-results/live-observation/red-rust.txt 2>&1
          code=$?
          set -e
          cat test-results/live-observation/red-rust.txt
          test "$code" -eq 101
          ! grep -q '^error\[' test-results/live-observation/red-rust.txt
          grep -q 'test result: FAILED.' test-results/live-observation/red-rust.txt
          for name in live_login_enter_weixin_is_recognized_for_auth_and_health live_login_safe_button_aliases_never_select_switch_account live_login_unrecognized_observation_does_not_reuse_online_state live_login_unknown_state_id_and_wrong_fsm_fail_closed live_login_wal_new_messages_are_visible_while_writer_remains_open live_login_wal_session_timestamp_is_current_without_checkpoint; do
            grep -q "test .*::$name ... FAILED" test-results/live-observation/red-rust.txt
          done
      - name: GREEN same actual native regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path agent-wechat/live-green/packages/agent-server-rust/Cargo.toml live_login_ -- --nocapture 2>&1 | tee test-results/live-observation/green-rust.txt
      - name: Optional explicit expected-account guard compatibility
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path agent-wechat/live-guarded/packages/agent-server-rust/Cargo.toml expected_account_ -- --nocapture 2>&1 | tee test-results/live-observation/guarded-rust.txt
          cargo test --locked --manifest-path agent-wechat/live-guarded/packages/agent-server-rust/Cargo.toml live_login_ -- --nocapture 2>&1 | tee test-results/live-observation/guarded-live-rust.txt
      - name: Build minimal release without optional guard or filename changes
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path agent-wechat/live-green/packages/agent-server-rust/Cargo.toml
          python3 scripts/package-live-observation.py --source agent-wechat/live-green --applied test-results/live-observation/green-source.json --binary "$CARGO_TARGET_DIR/release/agent-server" --output test-results/live-release
      - name: Preserve synthetic tests and reviewable binary-only candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-observation-${{ github.sha }}
          path: |
            test-results/live-observation
            test-results/live-release
          retention-days: 14
