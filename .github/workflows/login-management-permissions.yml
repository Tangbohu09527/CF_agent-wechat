name: Forced fresh QR production hardening

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-unit-lifecycle:
    name: Static, unit, and forced QR lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install required validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y acl shellcheck python3-venv

      - name: Check Bash syntax
        shell: bash
        run: |
          mapfile -d '' shell_files < <(
            find scripts tests docker -type f -name '*.sh' -print0
          )
          ((${#shell_files[@]} > 0))
          bash -n "${shell_files[@]}"

      - name: Run required ShellCheck
        shell: bash
        run: |
          mapfile -d '' shell_files < <(
            find scripts tests docker -type f -name '*.sh' -print0
          )
          shellcheck --severity=warning --external-sources -x \
            "${shell_files[@]}"

      - name: Compile Python sources
        run: python3 -m compileall -q scripts tests

      - name: Run dependency-free unit and QR tests
        run: python3 -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Run isolated forced fresh QR lifecycle tests
        run: python3 tests/integration/test_qr_runtime.py

      - name: Run safe management environment tests
        run: bash tests/integration/management_environment.sh

      - name: Run Python dependency integrity tests
        run: bash tests/integration/login_dependency_integrity.sh

      - name: Run API hard-timeout integration test
        run: bash tests/integration/api_hard_timeout.sh

      - name: Run repository hygiene unit tests
        run: python3 -m unittest discover -s tests/static -p "test_*.py" -v

      - name: Scan secrets, controls, UTF-8, Markdown, links, and CI policy
        run: python3 tests/static/repository_hygiene.py

      - name: Check committed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$zero" ] || \
            ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git diff --check "$BASE_SHA" HEAD
          git log --check --format='%H' "${BASE_SHA}..HEAD"

  bootstrap:
    name: Staged Bootstrap and Fake Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Bootstrap prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y acl python3-venv
      - name: Run ordinary-user staged Bootstrap tests
        env:
          CF_REQUIRE_BOOTSTRAP_DEPLOYMENT_TEST: "1"
        run: bash tests/deployment/bootstrap_cfserver.sh

  linux-permissions:
    name: Root and ordinary-user permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install venv support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
      - name: Run root-only Token and Docker socket fallback tests
        run: >-
          sudo env GITHUB_ACTIONS=true CF_AGENT_WECHAT_PERMISSION_TEST=1
          bash tests/integration/login_management_permissions.sh

  dependency-lock-platforms:
    name: >-
      Lock check and target-only wheel download
      (CPython ${{ matrix.python-version }}, ${{ matrix.target-platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        target-platform:
          - manylinux_2_28_x86_64
          - manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Select the approved GIL-enabled CPython runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate the dependency lock on CPython
        run: |
          python -I -B scripts/verify_login_dependencies.py validate-runtime
          python -I -B scripts/verify_login_dependencies.py \
            validate-lock scripts/requirements.txt > /dev/null

      - name: Resolve hash-locked target wheels without executing them
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.target-platform }}
          TARGET_PYTHON: ${{ matrix.python-version }}
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
          PIP_NO_INPUT: "1"
        run: |
          target_abi="cp${TARGET_PYTHON/./}"
          destination="${RUNNER_TEMP}/locked-wheels"
          mkdir -p -- "$destination"
          timeout --signal=TERM --kill-after=5s 120s \
            python -I -B -m pip download \
              --require-hashes \
              --only-binary=:all: \
              --no-deps \
              --retries 2 \
              --timeout 15 \
              --implementation cp \
              --python-version "$TARGET_PYTHON" \
              --abi "$target_abi" \
              --platform "$TARGET_PLATFORM" \
              --dest "$destination" \
              --requirement scripts/requirements.txt
          mapfile -d '' artifacts < <(
            find "$destination" -maxdepth 1 -type f -print0
          )
          [ "${#artifacts[@]}" -eq 3 ]
          for artifact in "${artifacts[@]}"; do
            case "$artifact" in
              *.whl) ;;
              *) exit 1 ;;
            esac
          done

  compose-render:
    name: Real production Compose render
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Render and attest production Compose
        env:
          CF_REQUIRE_DOCKER_COMPOSE_CONFIG: "1"
        run: bash tests/deployment/validate_compose_config.sh

  docker-restart-no:
    name: restart=no Docker policy fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixture exits and daemon restart keep containers stopped
        run: >-
          sudo env GITHUB_ACTIONS=true CF_AGENT_WECHAT_RESTART_NO_TEST=1
          bash tests/integration/docker_restart_no.sh
