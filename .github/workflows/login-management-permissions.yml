name: Login management permissions

on:
  push:
    paths:
      - ".github/workflows/login-management-permissions.yml"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/login-management-permissions.yml"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-permissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install venv support
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Validate management scripts
        run: |
          bash -n scripts/common.sh scripts/status.sh scripts/login.sh
          bash -n tests/integration/management_environment.sh
          bash -n tests/integration/session_recovery.sh
          bash -n tests/helpers/mock_management_curl.sh
          bash -n tests/helpers/mock_management_docker.sh
          python3 -m py_compile scripts/qr_login.py tests/helpers/mock_agent_wechat.py
      - name: Run QR login unit tests
        run: python3 -m unittest -v tests/unit/test_qr_login.py
      - name: Run restart and session recovery test
        run: bash tests/integration/session_recovery.sh
      - name: Validate authoritative management environment
        run: bash tests/integration/management_environment.sh
      - name: Run root and ordinary-user integration test
        run: >-
          sudo env GITHUB_ACTIONS=true CF_AGENT_WECHAT_PERMISSION_TEST=1
          bash tests/integration/login_management_permissions.sh
