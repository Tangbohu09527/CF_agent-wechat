name: Forced fresh QR production hardening

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-unit-lifecycle:
    name: Static, unit, and forced QR lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install required validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-venv

      - name: Check Bash syntax
        shell: bash
        run: |
          mapfile -d '' shell_files < <(
            find scripts tests docker -type f -name '*.sh' -print0
          )
          ((${#shell_files[@]} > 0))
          for shell_file in "${shell_files[@]}"; do
            bash -n "$shell_file"
          done

      - name: Run required ShellCheck
        shell: bash
        run: |
          mapfile -d '' shell_files < <(
            find scripts tests docker -type f -name '*.sh' -print0
          )
          shellcheck --severity=warning --external-sources -x \
            "${shell_files[@]}"

      - name: Compile Python sources
        run: python3 -m compileall -q scripts tests

      - name: Run dependency-free unit and QR tests
        run: python3 -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Run isolated forced fresh QR lifecycle tests
        shell: bash
        run: |
          controller=/opt/cf-agent-gateway/deploy/wechat-runtime-control
          storage=/srv/storage/cf-agent-wechat
          cleanup_fixture() {
            case "$storage" in
              /srv/storage/cf-agent-wechat)
                sudo rm -rf -- "$storage"
                ;;
            esac
            sudo rm -f -- "$controller"
            sudo rmdir /opt/cf-agent-gateway/deploy 2>/dev/null || true
            sudo rmdir /opt/cf-agent-gateway 2>/dev/null || true
          }
          trap cleanup_fixture EXIT
          if sudo test -e "$storage" || sudo test -L "$storage"; then
            echo "fixed agent-wechat storage path is already occupied" >&2
            exit 1
          fi
          if sudo test -e "$controller" || sudo test -L "$controller"; then
            echo "fixed Gateway Runtime Controller path is already occupied" >&2
            exit 1
          fi
          sudo install -d -o root -g root -m 755 \
            /opt/cf-agent-gateway/deploy
          sudo install -o root -g root -m 755 \
            tests/helpers/mock_gateway_runtime_control.sh "$controller"
          sudo python3 tests/integration/test_qr_runtime.py
      - name: Run safe management environment tests
        run: bash tests/integration/management_environment.sh

      - name: Run API hard-timeout integration test
        run: bash tests/integration/api_hard_timeout.sh

      - name: Run repository hygiene unit tests
        run: python3 -m unittest discover -s tests/static -p "test_*.py" -v

      - name: Scan secrets, controls, UTF-8, Markdown, links, and CI policy
        run: python3 tests/static/repository_hygiene.py

      - name: Check committed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$zero" ] || \
            ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git diff --check "$BASE_SHA" HEAD
          git log --check --format='%H' "${BASE_SHA}..HEAD"

  bootstrap:
    name: Staged Bootstrap and Fake Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Bootstrap prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
      - name: Run ordinary-user staged Bootstrap tests
        env:
          CF_REQUIRE_BOOTSTRAP_DEPLOYMENT_TEST: "1"
        run: bash tests/deployment/bootstrap_cfserver.sh

  linux-permissions:
    name: Root and ordinary-user permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install venv support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
      - name: Run root-only Token and Docker socket fallback tests
        run: >-
          sudo env GITHUB_ACTIONS=true CF_AGENT_WECHAT_PERMISSION_TEST=1
          bash tests/integration/login_management_permissions.sh

  compose-render:
    name: Real production Compose render
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Render and attest production Compose
        env:
          CF_REQUIRE_DOCKER_COMPOSE_CONFIG: "1"
        run: bash tests/deployment/validate_compose_config.sh

  docker-restart-no:
    name: Real Docker restart=no lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exits and daemon initialization never restore Agent
        run: >-
          sudo env GITHUB_ACTIONS=true CF_AGENT_WECHAT_RESTART_NO_TEST=1
          bash tests/integration/docker_restart_no.sh

  controller-baseline-debian13:
    name: Debian 13 real permissions - original defect reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce fixed original commit in clean Debian 13 amd64
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          docker pull --platform linux/amd64 debian:13-slim
          docker image inspect debian:13-slim \
            --format 'debian_image_id={{.Id}} debian_repo_digests={{json .RepoDigests}}' \
            | tee test-results/controller-baseline.log
          docker run --rm --platform linux/amd64 \
            -e CF_CONTROLLER_PERMISSION_DISPOSABLE=1 \
            -v "$PWD:/src:ro" debian:13-slim /bin/bash -c '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git sudo python3
              bash /src/tests/integration/controller_real_permissions.sh --baseline-only
            ' 2>&1 | tee -a test-results/controller-baseline.log
      - name: Preserve original-defect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-baseline-debian13
          path: test-results/controller-baseline.log
