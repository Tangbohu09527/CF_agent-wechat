name: Pinned upstream media retrieval candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-candidate:
    name: Fixed image identity and isolated media regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the exact upstream candidate
        uses: actions/checkout@v4
        with:
          repository: thisnick/agent-wechat
          ref: 96c2e90c497d999bf5189a134a9b3b293731f42e
          path: agent-wechat/candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Verify fixed image without starting its entrypoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/media image-root/opt
          candidate=$(python3 -c 'import json; print(json.load(open("upstream/media-retrieval.lock.json"))["candidate"]["image"])')
          docker pull --platform linux/amd64 "$candidate"
          docker image inspect "$candidate" --format '{{.Id}} {{json .RepoDigests}}' > test-results/media/image-identity.txt
          container=$(docker create --network none --entrypoint /bin/true "$candidate")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opt/tools" image-root/opt/tools
          docker cp "$container:/opt/agent-server" image-root/opt/agent-server
          docker cp "$container:/opt/wechat" image-root/opt/wechat
          python3 scripts/verify-media-candidate.py --source agent-wechat/candidate --image-root image-root | tee test-results/media/identity.txt
          # A separate disposable container runs tool/codec checks only. No
          # WeChat entrypoint, host session, production mount or network access.
          docker run --rm --network none --read-only --entrypoint /bin/sh "$candidate" -c 'set -eu; command -v python3; command -v readelf; command -v ffmpeg; python3 -c "import frida"' > test-results/media/runtime-dependencies.txt
      - name: Exercise pinned native helper guards without native invocation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s agent-wechat/candidate/tests -p test_media_download.py -v 2>&1 | tee test-results/media/python.txt
          node --test agent-wechat/candidate/tests/media-download.test.cjs | tee test-results/media/node.txt
      - name: Exercise the actual Rust media reader with synthetic caches
        shell: bash
        run: |
          set -euo pipefail
          # This is a fresh CI VM; refuse any pre-existing WeChat directory.
          test ! -e /home/wechat
          sudo install -d -o "$(id -u)" -g "$(id -g)" /home/wechat/xwechat_files /home/wechat/Documents/xwechat_files
          cat tests/upstream/media_cache_contract.rs >> agent-wechat/candidate/packages/agent-server-rust/src/tools/wechat_media.rs
          cargo test --locked --manifest-path agent-wechat/candidate/packages/agent-server-rust/Cargo.toml -- --nocapture 2>&1 | tee test-results/media/rust.txt
      - name: Preserve isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-candidate-${{ github.sha }}
          path: test-results/media
          if-no-files-found: warn
          retention-days: 14
